services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pqrsddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8090:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Chatwoot: imagen y .env.chatwoot repetidos en prepare / rails / sidekiq (evita servicios fantasma con anclas YAML).

  chatwoot_db_prepare:
    image: chatwoot/chatwoot:v4.0.1-ce
    env_file:
      - .env.chatwoot
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot_postgres:
        condition: service_healthy
      chatwoot_redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: [ 'bundle', 'exec', 'rails', 'db:chatwoot_prepare' ]
    restart: "no"

  chatwoot_rails:
    image: chatwoot/chatwoot:v4.0.1-ce
    env_file:
      - .env.chatwoot
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot_db_prepare:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: [ 'bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0' ]
    restart: unless-stopped

  chatwoot_sidekiq:
    image: chatwoot/chatwoot:v4.0.1-ce
    env_file:
      - .env.chatwoot
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot_db_prepare:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: [ 'bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml' ]
    restart: unless-stopped

  chatwoot_postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - chatwoot_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: elkiko123
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  chatwoot_redis:
    image: redis:alpine
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "elkiko123" ]
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "elkiko123", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_data:
  chatwoot_pg_data:
  chatwoot_redis_data:
  chatwoot_storage:
